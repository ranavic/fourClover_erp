databases:
  - name: fourclover-db
    plan: free
    databaseName: fourclover_erp
    user: fourclover

services:
  - type: web
    name: fourclover-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build && npm run db:init:prod
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fourclover-db
          property: connectionString

  - type: web
    name: fourclover-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
